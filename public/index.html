<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OfferPilot Light</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="eyebrow">OFFERPILOT LIGHT</span><h1>轻量 AI 面试助手</h1><p>本机运行，几分钟开始训练。</p></div><button id="settingsBtn" class="ghost">模型设置</button></header><section id="setup" class="panel"><div class="steps"><b>01 模型</b><b>02 岗位</b><b>03 简历</b></div><div class="grid"><label>面试岗位<input id="role" value="Java 后端工程师"></label><label>岗位描述<textarea id="description" rows="3" placeholder="粘贴招聘要求或技术栈"></textarea></label><label class="upload">上传 PDF 简历<input id="resume" type="file" accept="application/pdf"><span id="fileName">选择文件，最大 10MB</span></label></div><button id="generate" class="primary">生成 15 道专属面试题 <span>→</span></button><p id="setupError" class="error"></p></section><section id="training" class="hidden"><div class="training-head"><div><span id="progress">第 1 / 15 题</span><h2 id="question"></h2><small id="meta"></small></div><button id="backSetup" class="ghost">返回设置</button></div><div id="answerPane" class="panel"><textarea id="answer" rows="9" placeholder="输入你的回答，建议按真实面试方式组织..."></textarea><div class="answer-foot"><span id="count">0 字</span><button id="submit" class="primary">提交并获取评价</button></div></div><div id="feedback" class="panel hidden"></div><div class="training-nav"><button id="prev" class="ghost">上一题</button><button id="next" class="primary" disabled>下一题 →</button></div></section><section class="history panel"><div class="history-head"><h2>最近训练</h2><button id="refresh" class="ghost">刷新</button></div><div id="sessions">暂无记录</div></section></main><dialog id="settings"><form method="dialog"><h2>模型设置</h2><label>API Key<input id="apiKey" type="password"></label><label>服务地址<input id="baseUrl" value="https://dashscope.aliyuncs.com/compatible-mode/v1"></label><label>模型名称<input id="model" value="qwen-plus"></label><p class="muted">配置仅保存在当前浏览器，不会写入代码文件。</p><button class="primary" value="save">保存</button></form></dialog><script src="/app.js"></script></body></html>
